<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <!-- App Icon Background (Smooth rounded rectangle) -->
  <rect width="256" height="256" rx="56" fill="#ffffff" />

  <!-- Geolocation Ripple/Shadow (Represents digital tracking area) -->
  <ellipse cx="128" cy="205" rx="55" ry="14" fill="#CAE8E8" opacity="0.8" />
  <ellipse cx="128" cy="205" rx="30" ry="7" fill="#28469E" opacity="0.2" />

  <!-- Main Geolocation Pin (Represents location-based tracking) -->
  <path d="M 128 35 
           C 86.6 35 53 68.6 53 110 
           C 53 160 128 220 128 220 
           C 128 220 203 160 203 110 
           C 203 68.6 169.4 35 128 35 Z" 
        fill="#28469E"/>

  <!-- Inner Circle (Creates contrast for the checkmark) -->
  <circle cx="128" cy="110" r="42" fill="#CAE8E8"/>

  <!-- Attendance Checkmark (Represents day-to-day successful check-ins) -->
  <path d="M 106 112 
           L 121 127 
           L 153 92" 
        fill="none" 
        stroke="#28469E" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Floating Digital Nodes (Represents cross-device syncing: phone/laptop) -->
  <circle cx="198" cy="60" r="9" fill="#CAE8E8" />
  <circle cx="62" cy="50" r="6" fill="#CAE8E8" />
  <circle cx="210" cy="135" r="5" fill="#CAE8E8" />
</svg>
